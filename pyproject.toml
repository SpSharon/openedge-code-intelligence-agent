[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openedge-agent"
version = "0.1.0"
description = "Evaluation-first, citation-checked code-intelligence agent over a synthetic Progress 4GL / OpenEdge corpus (retrieval, single-shot and tool-using agents, scoreboards)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["openedge_agent*"]
